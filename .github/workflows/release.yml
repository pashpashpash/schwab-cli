name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/schwab-cli dist/schwab-cli-${{ matrix.target }}
          chmod +x dist/schwab-cli-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: schwab-cli-${{ matrix.target }}
          path: dist/schwab-cli-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish tagged release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$RELEASE_TAG" dist/schwab-cli-* \
            --title "$RELEASE_TAG" \
            --notes "schwab-cli $RELEASE_TAG"
