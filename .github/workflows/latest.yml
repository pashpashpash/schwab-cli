name: Latest Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/schwab-cli dist/schwab-cli-${{ matrix.target }}
          chmod +x dist/schwab-cli-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: schwab-cli-${{ matrix.target }}
          path: dist/schwab-cli-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish mutable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          gh release delete latest --cleanup-tag --yes || true
          git tag -f latest "$GITHUB_SHA"
          git push origin -f latest
          gh release create latest dist/schwab-cli-* \
            --title "Latest main build" \
            --notes "Automated schwab-cli build from main at ${GITHUB_SHA}." \
            --latest
