[package]
name = "schwab-cli"
version = "0.1.0"
edition = "2021"
description = "Agent-first Rust CLI for Schwab Trader API accounts, trading, market data, and snapshots"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
urlencoding = "2.1"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
